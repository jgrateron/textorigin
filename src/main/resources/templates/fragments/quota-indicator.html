<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
    Indicador de análisis disponibles hoy desde la conexión del visitante. Se refresca solo:
    cuando un análisis termina, la propia página pide este fragmento a /quota y sustituye
    este bloque por el actualizado.
-->
<section th:fragment="indicator" id="quota-indicator" class="card quota-card">

    <div class="quota-card__head">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3l8 4v5c0 4.5-3.2 7.9-8 9-4.8-1.1-8-4.5-8-9V7z"/>
            <path d="M9.5 12.5l2 2 3.5-4"/>
        </svg>
        <h3 class="quota-card__title">Límite diario de tu conexión</h3>
    </div>

    <p class="quota-card__value" th:classappend="${quota.ipRemaining == 0} ? 'quota-card__value--empty'">
        <span th:text="${quota.ipRemaining}">10</span>
        <span class="quota-card__value-total" th:text="'/ ' + ${quota.ipLimit}">/ 10</span>
    </p>

    <div class="quota-bar" role="progressbar" aria-label="Análisis diarios disponibles"
         th:attr="aria-valuenow=${quota.ipRemaining},aria-valuemin=0,aria-valuemax=${quota.ipLimit}">
        <div th:class="${quota.ipBarClass}" th:style="'width:' + ${quota.ipPercent} + '%'"></div>
    </div>

    <p class="quota-card__hint" th:switch="${quota.ipRemaining}">
        <span th:case="0">Has agotado los análisis de hoy desde esta conexión. El contador se reinicia cada día.</span>
        <span th:case="1">Te queda 1 análisis hoy desde esta conexión.</span>
        <span th:case="*" th:text="'Te quedan ' + ${quota.ipRemaining} + ' análisis hoy desde esta conexión.'">Te quedan 10 análisis.</span>
    </p>

    <p class="quota-card__contact muted small" th:if="${quota.exhausted}">
        ¿Necesitas más análisis?
        <a th:href="@{'mailto:' + ${contactEmail}}" th:text="${contactEmail}">jgrateron@gmail.com</a>
    </p>
</section>

</body>
</html>
