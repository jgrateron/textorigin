server:
  port: 8080
  # Necesario para que Spring respete X-Forwarded-For / X-Forwarded-Proto cuando
  # la aplicación se despliega detrás de un proxy inverso (nginx, Traefik, Apache...).
  forward-headers-strategy: framework
  # Apagado ordenado: al recibir SIGTERM (docker stop, despliegue, reinicio) se dejan de
  # aceptar peticiones nuevas y se espera a que terminen las que están en curso.
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: textorigin
  # TextOrigin cablea el cliente de DeepSeek explícitamente en DeepSeekConfig para poder
  # arrancar aunque todavía no haya clave de API configurada (la autoconfiguración de
  # Spring AI aborta el arranque si spring.ai.openai.api-key está vacía). Por eso se
  # excluyen sus autoconfiguraciones: solo se usan las clases del cliente, no el starter
  # automático.
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  session:
    timeout: 30m
  thymeleaf:
    cache: false
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com
      chat:
        options:
          # Nombre actual del modelo (el antiguo deepseek-chat quedó retirado el 24/07/2026).
          # El modo de razonamiento se desactiva en la petición, desde DeepSeekRequest.
          model: deepseek-flash
          temperature: 0.2

textorigin:
  # Correo de contacto que aparece en la interfaz, en los mensajes de error y en el informe PDF.
  contact-email: jgrateron@gmail.com
  model:
    # Por defecto se llama a DeepSeek por HTTP directo: es la única vía que puede enviar
    # parámetros propios del proveedor (thinking desactivado). Con true se usa el ChatClient
    # de Spring AI cuando la clave está configurada; ambas vías siguen operativas.
    prefer-spring-ai: false
  quota:
    max-per-ip-per-day: 10
  captcha:
    # Verificación anti-bots con Cloudflare Turnstile. Sin claves configuradas la aplicación
    # arranca igualmente (avisa por log) y el formulario queda solo con el límite diario.
    # Guía: https://developers.cloudflare.com/turnstile/
    enabled: true
    site-key: ${TURNSTILE_SITE_KEY:}
    secret-key: ${TURNSTILE_SECRET_KEY:}
    # Endpoint de verificación; solo se cambia en pruebas o tras un proxy propio.
    verify-url: https://challenges.cloudflare.com/turnstile/v0/siteverify
  analysis:
    min-text-length: 100
    max-segments: 50
    concurrent-segments: 5
    retry-attempts: 3
    retry-delay-ms: 1000

logging:
  level:
    root: INFO
    com.textorigin: INFO
