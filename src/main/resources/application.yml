server:
  port: 8080
  # Necesario para que Spring respete X-Forwarded-For / X-Forwarded-Proto cuando
  # la aplicación se despliega detrás de un proxy inverso (nginx, Traefik, Apache...).
  forward-headers-strategy: framework
  # Apagado ordenado: al recibir SIGTERM (docker stop, despliegue, reinicio) se dejan de
  # aceptar peticiones nuevas y se espera a que terminen las que están en curso.
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: textorigin
  # TextOrigin cablea el cliente de DeepSeek explícitamente en DeepSeekConfig para poder
  # arrancar aunque todavía no haya clave de API configurada (la autoconfiguración de
  # Spring AI aborta el arranque si spring.ai.openai.api-key está vacía). Por eso se
  # excluyen sus autoconfiguraciones: solo se usan las clases del cliente, no el starter
  # automático.
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  session:
    timeout: 30m
  thymeleaf:
    cache: false
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.2

textorigin:
  quota:
    max-per-session: 3
    max-per-ip-per-day: 10
  analysis:
    min-text-length: 100
    max-segments: 50
    concurrent-segments: 5
    retry-attempts: 3
    retry-delay-ms: 1000

logging:
  level:
    root: INFO
    com.textorigin: INFO
